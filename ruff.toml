line-length = 120
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "catalog", "homeassistant"]
combine-as-imports = true

[lint.per-file-ignores]
"tests/*" = ["E501"]
